# Host-based routing handled by K3s' built-in Traefik.
# The last rule has no host, so it matches every other Host header -> app3 (default).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apps
spec:
  ingressClassName: traefik
  rules:
    - host: app1.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: app-one, port: {number: 80}}
    - host: app2.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: app-two, port: {number: 80}}
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: app-three, port: {number: 80}}
