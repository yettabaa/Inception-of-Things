apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1-deployment

spec:
  replicas: 1
  selector:
    matchLabels: {app: app1}
  template:
    metadata:
      labels: {app: app1}
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo:1.0  # multi-arch (amd64 + arm64)
          ports:
            - containerPort: 5678
          args: ["-text=Hello from app1."]
---
apiVersion: v1
kind: Service
metadata:
  name: app1-service
spec:
  selector: {app: app1}
  ports:
    - {port: 80, targetPort: 5678}
---
