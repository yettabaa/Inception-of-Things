# Argo CD Application: keep namespace "dev" in sync with the public GitHub repo.
# Repo name contains the team login (reben-ha), as the subject requires.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: playground
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RED-MEGA/reben-ha-iot.git
    targetRevision: HEAD
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
