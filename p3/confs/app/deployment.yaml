apiVersion: apps/v1
kind: Deployment
metadata:
  name: playground-deployment
spec:
  replicas: 1
  selector:
    matchLabels: {app: playground}
  template:
    metadata:
      labels: {app: playground}
    spec:
      containers:
        - name: playground
          image: absaid/playground:v1
          ports:
            - containerPort: 8888
