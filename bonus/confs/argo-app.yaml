# Repository credentials: GitLab serves a self-signed certificate, so Argo CD
# must skip TLS verification; root/password lets it read a private project.
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: https://gitlab.${GITLAB_IP}.nip.io/root/${GITLAB_REPO}.git
  insecure: "true"
  username: root
  password: ${GITLAB_ROOT_PASSWORD}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: playground
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.${GITLAB_IP}.nip.io/root/${GITLAB_REPO}.git
    targetRevision: HEAD
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
