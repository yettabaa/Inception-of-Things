apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: p3-application
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.10.32.66.207.nip.io/root/REPO_NAME
    targetRevision: HEAD
    path: . 
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
