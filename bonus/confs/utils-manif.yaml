apiVersion: v1
kind: Secret
metadata:
  name: glab-secrets
  namespace: gitlab
stringData:
  PG_PASS: ${PG_PASS}
  MINIO_PASS: ${MINIO_PASS}
  REDIS_USER: ${REDIS_USER}
  REDIS_PASS: ${REDIS_PASS}
  OBJ_STORE: |
    provider: AWS
    region: us-east-1
    endpoint: "http://host.k3d.internal:9000"
    path_style: true
    aws_access_key_id: ${MINIO_USER}
    aws_secret_access_key: ${MINIO_PASS}