global:
  hosts:
    domain: ${GITLAB_IP}.nip.io
    externalIP: ${GITLAB_IP}

  gatewayApi:
    configureCertmanager: false

  redis:
    host: host.k3d.internal
    user: ${REDIS_USER}
    auth:
      secret: glab-secrets
      key: REDIS_PASS

  psql:
    host: host.k3d.internal
    username: ${PG_USER}
    password:
      secret: glab-secrets
      key: PG_PASS

  appConfig:
    object_store:
      enabled: true
      connection:
        secret: glab-secrets
        key: OBJ_STORE

gatewayApiResources:
  gateway:
    listeners:
      gitlab-web:
        tls:
          certificateRefs:
            - name: gitlab-wildcard-tls

registry:
  enabled: false

gitlab:
  toolbox:
    backups:
      objectStorage:
        config:
          secret: glab-secrets
          key: OBJ_STORE
