# Local GitLab CE (official all-in-one image) in namespace "gitlab", routed by K3s' Traefik.
# Host access: http://gitlab.local:8888 (k3d maps host 8888 -> Traefik :80).
# The root password comes from Secret "gitlab-root-password", created by scripts/setup.sh.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-data
  namespace: gitlab
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab
  namespace: gitlab
  labels: {app: gitlab}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: gitlab}
  template:
    metadata:
      labels: {app: gitlab}
    spec:
      containers:
        - name: gitlab
          image: gitlab/gitlab-ce:latest
          ports:
            - containerPort: 80
          env:
            - name: GITLAB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: gitlab-root-password, key: password}
            - name: GITLAB_OMNIBUS_CONFIG
              value: |
                external_url 'http://gitlab.local:8888'
                nginx['listen_port'] = 80
                nginx['listen_https'] = false
                puma['worker_processes'] = 0
                sidekiq['concurrency'] = 5
                prometheus_monitoring['enable'] = false
                gitlab_kas['enable'] = false
                registry['enable'] = false
          resources:
            requests: {memory: 3Gi, cpu: 500m}
          readinessProbe:
            # /-/readiness is IP-allowlisted (404 for the kubelet), so probe the public sign-in page.
            httpGet: {path: /users/sign_in, port: 80, httpHeaders: [{name: Host, value: gitlab.local}]}
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 60
          volumeMounts:
            - {name: data, mountPath: /etc/gitlab, subPath: config}
            - {name: data, mountPath: /var/log/gitlab, subPath: logs}
            - {name: data, mountPath: /var/opt/gitlab, subPath: data}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: gitlab-data}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: gitlab
spec:
  selector: {app: gitlab}
  ports:
    - {port: 80, targetPort: 80}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitlab
  namespace: gitlab
spec:
  ingressClassName: traefik
  rules:
    - host: gitlab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: gitlab, port: {number: 80}}
