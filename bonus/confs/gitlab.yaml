apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-deployment
  namespace: gitlab
spec:
  selector:
    matchLabels: {app: gitlab}
  template:
    metadata:
      labels: {app: gitlab}
    spec:
      containers:
        - name: gitlab
          image: gitlab/gitlab-ce:19.5.3-ce.0
          env:
            - name: GITLAB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: gitlab-root-password, key: password}
            - name: GITLAB_OMNIBUS_CONFIG
              value: |
                external_url 'http://gitlab.local:8888'
                nginx['listen_port'] = 80
          # Ready only once GitLab answers, so setup.sh's rollout wait is real.
          readinessProbe:
            httpGet: {path: /users/sign_in, port: 80, httpHeaders: [{name: Host, value: gitlab.local}]}
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab-service
  namespace: gitlab
spec:
  selector: {app: gitlab}
  ports:
    - {port: 80}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitlab
  namespace: gitlab
spec:
  ingressClassName: traefik
  rules:
    - host: gitlab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: gitlab-service, port: {number: 80}}
