# Minimal GitLab CE for local k3d – no TLS, no external DNS, no certmanager.
# Pinned to chart v7.x which still bundles PostgreSQL and Redis.
global:
  edition: ce
  hosts:
    domain: gitlab.local
    https: false
  ingress:
    configureCertmanager: false
    tls:
      enabled: false
  certmanager:
    install: false
  minio:
    enabled: true   # keep bundled minio (object storage required by GitLab)
  # Disable unneeded components to keep resource usage low
  kas:
    enabled: false
  pages:
    enabled: false

certmanager:
  install: false
  installCRDs: false

certmanager-issuer:
  email: local@gitlab.local   # required by the chart even when not used

nginx-ingress:
  enabled: false    # use the k3d Traefik ingress instead

prometheus:
  install: false

gitlab-runner:
  install: false

registry:
  enabled: false

# Reduce resource requests so the cluster can handle GitLab alongside ArgoCD
gitlab:
  webservice:
    minReplicas: 1
    maxReplicas: 1
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
  sidekiq:
    minReplicas: 1
    maxReplicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
  gitaly:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
  toolbox:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi

postgresql:
  image:
    repository: bitnamilegacy/postgresql
  metrics:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

redis:
  image:
    repository: bitnamilegacy/redis
  metrics:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
