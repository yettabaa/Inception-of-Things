apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: playground
  namespace: argocd
spec:
  project: default
  source:
    # Points to the local GitLab repo (cluster-internal service URL)
    repoURL: http://gitlab-webservice-default.gitlab.svc.cluster.local:8080/root/playground.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

